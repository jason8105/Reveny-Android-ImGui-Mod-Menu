plugins {
    id 'com.android.library'
}

android {
    namespace 'com.reveny.native'
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fexceptions -frtti"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }
}
