name: Build Zygisk Module Debug

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.18.1'

      - name: Build Zygisk Module
        run: |
          chmod +x ./gradlew
          ./gradlew :module:assembleDebug

      - name: Package Magisk Zip
        run: |
          mkdir -p final_package
          # Yahan apni module zip file ya folder ko zip bana lena
          cd module/build/outputs/ || true
          # Tu apne hisab se yahan zip command ya path adjust kar lena
          
      - name: Upload Zygisk Module Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zygisk-Module-Debug-Installable
          path: final_package/*.zip
