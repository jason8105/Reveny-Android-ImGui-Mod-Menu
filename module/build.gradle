plugins {
    id 'com.android.application'
}

android {
    namespace 'com.reveny.mod'
    compileSdk 34

    defaultConfig {
        applicationId "com.reveny.mod"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}

task zipMagiskModule(type: Zip) {
    dependsOn 'assembleDebug'
    
    archiveFileName = "Reveny-Zygisk-Module-v${android.defaultConfig.versionName}.zip"
    destinationDirectory = file("$buildDir/outputs/")

    from("${projectDir}/module.prop")
    from("${projectDir}/zygisk.sh")
    
    into("zygisk") {
        from("$buildDir/intermediates/stripped_native_libs/debug/out/lib/arm64-v8a/")
        include "*.so"
    }
}

afterEvaluate {
    tasks.named("assembleDebug").configure {
        finalizedBy("zipMagiskModule")
    }
}
